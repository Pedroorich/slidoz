<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SlidOZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" crossorigin="anonymous">
  <script>
    // Prevent polyfills from throwing errors when trying to overwrite fetch
    try {
      if (typeof window !== 'undefined' && window.fetch) {
        Object.defineProperty(window, 'fetch', {
          value: window.fetch,
          writable: true,
          configurable: true
        });
      }
    } catch (e) {
      console.warn('Could not make window.fetch writable:', e);
    }

    // Capturador Global de Erros de Inicialização
    window.addEventListener('error', function (event) {
      console.error("Global Error Caught:", event.error);
      const root = document.getElementById('root');
      if (root) {
        root.innerHTML = `
            <div style="background: #0A0A0A; color: #FF453A; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; padding: 20px; box-sizing: border-box; text-align: center;">
              <div style="max-width: 600px; width: 100%; background: #161616; border: 1px solid rgba(255, 69, 58, 0.2); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                <h1 style="font-size: 22px; margin-bottom: 10px; font-weight: bold; color: #FFF;">Erro de Inicialização (JS)</h1>
                <p style="color: rgba(255,255,255,0.7); font-size: 13px; margin-bottom: 20px; line-height: 1.5;">
                  Ocorreu um erro ao carregar a aplicação no seu navegador:
                </p>
                <div style="background: #050505; border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; text-align: left; font-family: monospace; font-size: 12px; color: #FFF; overflow-x: auto; white-space: pre-wrap; margin-bottom: 20px; max-height: 200px;">
                  <b>Mensagem:</b> ${event.message}\n<b>Arquivo:</b> ${event.filename}\n<b>Linha:</b> ${event.lineno}
                </div>
                <p style="color: rgba(255,255,255,0.4); font-size: 11px;">
                  Abra o Console do Desenvolvedor (F12) para ver o rastreamento completo.
                </p>
              </div>
            </div>
          `;
      }
    });

    window.addEventListener('unhandledrejection', function (event) {
      console.error("Global Promise Rejection Caught:", event.reason);
      const root = document.getElementById('root');
      if (root) {
        root.innerHTML = `
            <div style="background: #0A0A0A; color: #FF453A; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; padding: 20px; box-sizing: border-box; text-align: center;">
              <div style="max-width: 600px; width: 100%; background: #161616; border: 1px solid rgba(255, 69, 58, 0.2); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                <h1 style="font-size: 22px; margin-bottom: 10px; font-weight: bold; color: #FFF;">Erro de Promessa (Unhandled)</h1>
                <p style="color: rgba(255,255,255,0.7); font-size: 13px; margin-bottom: 20px; line-height: 1.5;">
                  Uma rejeição assíncrona não foi capturada durante o carregamento:
                </p>
                <div style="background: #050505; border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; text-align: left; font-family: monospace; font-size: 12px; color: #FFF; overflow-x: auto; white-space: pre-wrap; margin-bottom: 20px; max-height: 200px;">
                  <b>Razão:</b> ${event.reason?.message || event.reason?.toString() || event.reason}
                </div>
                <p style="color: rgba(255,255,255,0.4); font-size: 11px;">
                  Abra o Console do Desenvolvedor (F12) para ver o rastreamento completo.
                </p>
              </div>
            </div>
          `;
      }
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
